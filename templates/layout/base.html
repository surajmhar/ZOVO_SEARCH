<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/favicon.png') }}"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}{% endblock %}</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/navbar.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/hero.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/stats.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/services.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/why.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/process.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/portfolio.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/testimonials.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/faq.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/cta.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/footer.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/animations.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/responsive.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/about.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/services-page.css') }}"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
  </head>

  <body>
    {% include 'components/navbar.html' %} {% block content %} {% endblock %} {%
    include 'components/footer.html' %}

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    <script src="{{ url_for('static', filename='js/services-page.js') }}"></script>

    <script>
      lucide.createIcons();
    </script>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
      AOS.init({
        duration: 900,
        once: true,
        offset: 100,
      });
    </script>
  </body>
</html>
